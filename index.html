<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hAppy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 1. TRAVA O SCROLL AQUI */
        body {
            background-color: #1db6c9;
            overflow: hidden; 
            height: 100vh;
        }

        .bg-yellow { background-color: #ffd24c; }

        .btn-entrar {
            width: 70px;
            height: 70px;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-entrar:hover {
            transform: scale(1.1);
            background-color: #ffc107;
        }

        .img-circular {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .img-circular:hover {
            animation: balancoSuave 1.2s infinite; 
        }

        @keyframes balancoSuave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            50% { transform: rotate(-3deg); }
            75% { transform: rotate(1.5deg); }
        }

        .logo-animada {
            display: inline-block;
            cursor: pointer;
        }

        .logo-animada:hover {
            animation: balanco 0.5s ease-in-out infinite alternate;
        }

        @keyframes balanco {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }
    </style>
</head>
<body class="d-flex align-items-center">

    <div class="position-absolute top-0 end-0 p-5 text-end text-white fw-bold d-none d-lg-block" style="z-index: 10;">
        Rio Do Sul, <br>
        <span class="fw-normal">Santa Catarina</span>
    </div>

    <div class="container">
        <div class="row align-items-center">
            
            <div class="col-lg-6 text-white">
                <div class="fs-2 fw-bold text-dark mb-5 logo-animada">
                    😊 hAppy
                </div>

                <h1 class="display-3 fw-bold lh-1 mb-4">
                    Leve felicidade<br>
                    para o mundo
                </h1>

                <p class="fs-5 mb-5">
                    Visite orfanatos e mude o dia<br>
                    de muitas crianças.
                </p>
            </div>

            <div class="col-lg-6 text-center d-none d-lg-block">
                <img src="imagem/imagem.png" alt="Crianças" class="img-circular rounded-circle img-fluid">
            </div>

        </div>

        <div class="row mt-4">
            <div class="col-12 d-flex justify-content-end">
                <button class="btn btn-entrar bg-yellow border-0 rounded-4 fs-2 shadow-sm" onclick="irParaPagina()">
                    →
                </button>
            </div>
        </div>
    </div>

    <script>
        function irParaPagina(){
            window.location.href = "dados.html";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
