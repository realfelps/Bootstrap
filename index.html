<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>h.Appy</title>

    <style>

        body{
            margin:0;
            padding:0;
            background: #1db6c9;
            height:100vh;
            overflow:hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .logo{
            font-size: 35px;
            font-weight: bold;
            color: black;
        }

        .hero{
            height:100vh;
        }

        .texto{
            color:white;
        }

        .texto h1{
            font-size:65px;
            font-weight:bold;
            line-height:70px;
        }

        .texto p{
            margin-top:20px;
            font-size:20px;
        }

        .btn-entrar{
            margin-top:30px;
            width:70px;
            height:70px;
            border:none;
            border-radius:20px;
            background:#ffd24c;
            font-size:30px;
            transition:0.3s;
        }

        .btn-entrar:hover{
            transform:scale(1.1);
        }

        .criancas{
            width:500px;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="container hero d-flex align-items-center">

        <div class="row w-100 align-items-center">

            <!-- TEXTO -->
            <div class="col-lg-6 texto">

                <div class="logo mb-5">
                    😊 hAppy
                </div>

                <h1>
                    Leve felicidade<br>
                    para o mundo
                </h1>

                <p>
                    Visite orfanatos e mude o dia
                    de muitas crianças.
                </p>

                <p class="col-lg-6 texto"> 
                    Rio Do Sul, Santa Catarina
                </p>

                <!-- BOTÃO -->
                <button class="btn-entrar" onclick="irParaPagina()">
                    →
                </button>

            </div>

            <!-- IMAGEM -->
            <div class="col-lg-6 text-center">

                <img src="imagem/imagem.png" class="criancas">

            </div>

        </div>

    </div>

    <script>

        // SCRIPT PARA IR PARA OUTRA PÁGINA
        function irParaPagina(){

            window.location.href = "dados.html";

        }

    </script>

</body>
</html>
